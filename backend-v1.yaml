apiVersion: v1
kind: Service
metadata:
  name: backend-v1
  namespace: default
  labels:
    app: backend
    version: v1
spec:
  selector:
    app: backend
    version: v1
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v1
  namespace: default
  labels:
    app: backend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      version: v1
  template:
    metadata:
      labels:
        app: backend
        version: v1
    spec:
      containers:
      - name: backend
        image: nicholasjackson/fake-service:v0.26.2
        ports:
        - containerPort: 8080
        env:
        - name: LISTEN_ADDR
          value: 0.0.0.0:8080
        - name: NAME
          value: backend-v1
        - name: MESSAGE
          value: Hello From backend (v1)!
        readinessProbe:
          tcpSocket:
            port: 8080
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
